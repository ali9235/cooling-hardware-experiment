<svg xmlns="http://www.w3.org/2000/svg" width="960" height="380" viewBox="0 0 960 380" role="img" aria-labelledby="title desc">
<title id="title">VOLTRA Thermal Lab illustrated architecture</title>
<desc id="desc">Educational reference workflow, not proof of hardware operation.</desc>
<rect width="960" height="380" rx="20" fill="#0b111b"/>
<g font-family="Segoe UI,Arial,sans-serif">
<text x="36" y="42" fill="#ffbb86" font-size="18" letter-spacing="5">VOLTRA</text>
<text x="36" y="95" fill="#ecf2f7" font-size="40" font-weight="700">Thermal Lab</text>
<text x="36" y="132" fill="#a2b2c5" font-size="21">Understand the assembly before the claim.</text>
<rect x="36" y="173" width="280" height="117" rx="12" fill="#121e2b" stroke="#ffbb86"/>
<text x="54" y="200" fill="#ffbb86" font-size="16">01</text>
<text x="54" y="231" fill="#ecf2f7" font-size="20" font-weight="600">Inspect the assembly</text>
<text x="54" y="263" fill="#a2b2c5" font-size="13">Fan, visible fins and metal fittings</text>
<path d="M322 230h12m-4-4 4 4-4 4" fill="none" stroke="#ffbb86" stroke-width="2"/>
<rect x="340" y="173" width="280" height="117" rx="12" fill="#121e2b" stroke="#ffbb86"/>
<text x="358" y="200" fill="#ffbb86" font-size="16">02</text>
<text x="358" y="231" fill="#ecf2f7" font-size="20" font-weight="600">Identify the mechanism</text>
<text x="358" y="263" fill="#a2b2c5" font-size="13">Confirm ratings, layers and power</text>
<path d="M626 230h12m-4-4 4 4-4 4" fill="none" stroke="#ffbb86" stroke-width="2"/>
<rect x="644" y="173" width="280" height="117" rx="12" fill="#121e2b" stroke="#ffbb86"/>
<text x="662" y="200" fill="#ffbb86" font-size="16">03</text>
<text x="662" y="231" fill="#ecf2f7" font-size="20" font-weight="600">Measure before comparing</text>
<text x="662" y="263" fill="#a2b2c5" font-size="13">Ambient, load, time and temperatures</text>
<text x="36" y="335" fill="#a2b2c5" font-size="16">Illustrated reference workflow. Hardware commissioning and measurements remain pending.</text>
</g></svg>
